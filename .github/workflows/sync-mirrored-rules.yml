name: Sync mirrored rule sets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mirrored-rule-sets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download valid upstream updates
        run: bash Ruleset/Mirror/sync.sh

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- Ruleset/Mirror; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ruleset/Mirror
          git commit -m "chore: update mirrored rule sets"
          git push
